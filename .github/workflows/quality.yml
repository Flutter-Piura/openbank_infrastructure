name: Infrastructure quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infrastructure-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openbank_infrastructure
      - name: Checkout API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Flutter-Piura/openbank_api
          path: openbank_api
      - name: Validate Compose model
        working-directory: openbank_infrastructure
        run: docker compose config --quiet
      - name: Start the complete stack
        working-directory: openbank_infrastructure
        run: docker compose up --build --wait
      - name: Smoke test health and login
        working-directory: openbank_infrastructure
        run: ./scripts/smoke.sh
      - name: Show diagnostics on failure
        if: failure()
        working-directory: openbank_infrastructure
        run: docker compose ps && docker compose logs --no-color
      - name: Stop the stack
        if: always()
        working-directory: openbank_infrastructure
        run: docker compose down --volumes
